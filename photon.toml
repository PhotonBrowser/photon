# `./photon setup` initializes these pinned submodules from .gitmodules.
# Recursive entries also initialize submodules nested inside that dependency.
[[submodules]]
path = "Engine"
recursive = true

[[submodules]]
path = "vendor/gpuix"
recursive = true

[[submodules]]
path = "vendor/gpui-ce"

# Setup ensures these Git remotes exist with the configured URLs.
[[repositories]]
path = "."

[[repositories.remotes]]
name = "origin"
url = "git@github.com:PhotonBrowser/photon.git"

[[repositories]]
path = "Engine"

[[repositories.remotes]]
name = "origin"
url = "git@github.com:PhotonBrowser/photon-engine.git"
fetch_branches = ["master"]

[[repositories.remotes]]
name = "upstream"
url = "git@github.com:LadybirdBrowser/ladybird.git"

[[repositories]]
path = "vendor/gpuix"

[[repositories.remotes]]
name = "origin"
url = "git@github.com:PhotonBrowser/gpuix.git"
fetch_branches = ["main"]

[[repositories.remotes]]
name = "upstream"
url = "git@github.com:remorses/gpuix.git"

[[repositories]]
path = "vendor/gpui-ce"

[[repositories.remotes]]
name = "origin"
url = "git@github.com:PhotonBrowser/gpui-ce.git"
fetch_branches = ["main"]

[[repositories.remotes]]
name = "upstream"
url = "https://github.com/gpui-ce/gpui-ce.git"
fetch_branches = ["main"]

[[repositories]]
path = "vendor/gpuix/zed"
untrack_branches = ["main"]

[[repositories.remotes]]
name = "origin"
url = "git@github.com:PhotonBrowser/zed.git"
fetch_branches = ["photon/live-image"]

[[repositories.remotes]]
name = "upstream"
url = "git@github.com:remorses/zed.git"
fetch_branches = ["gpuix"]
