[package]
name = "photon-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
default = ["engine"]
engine = []

[dependencies]
gpuix-native = { path = "../../vendor/gpuix/packages/native", default-features = false }
photon-omnibox = { path = "../photon-omnibox" }
gpui_platform = { path = "../../vendor/gpuix/zed/crates/gpui_platform", default-features = false, features = ["runtime_shaders"] }
gpui = { path = "../../vendor/gpuix/zed/crates/gpui", default-features = false, features = ["font-kit", "profiler"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-video = "0.5.2"
gpui_apple = { path = "../../vendor/gpuix/zed/crates/gpui_apple" }
metal = "0.33"

[build-dependencies]
cc = "1"
