[package]
name = "photon-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "photon"

[[bin]]
name = "photon"
path = "src/main.rs"

[[bin]]
name = "ph"
path = "src/ph.rs"

[dependencies]
photon-brand = { path = "../photon-brand" }
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
indicatif = "0.18.6"
owo-colors = { version = "4.4.0", features = ["supports-colors"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8.23"
