# Photon shell theme tokens. Colors use #RRGGBB; measurements are logical px.
# These values are the source of truth for semantic colors, opacity, and radii.

[palette.light]
background = "#ffffff"
page = "#ffffff"
window = "#e9ebf0"
text = "#252525"
container = "#f4f5f5"
selected = "#aeaeae"

[palette.dark]
background = "#222222"
page = "#292d36"
window = "#171a23"
text = "#ffffff"
container = "#262626"
selected = "#747474"

[colors.error]
light = "#ff3b30"
dark = "#ff453a"

[colors.secure]
light = "#248a3d"
dark = "#8ccf9a"

[colors.chosen_foreground]
