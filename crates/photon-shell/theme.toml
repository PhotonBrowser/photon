[opacity]
text_secondary = 0.72
performance_surface = 0.95
shortcut_icon_surface = 0.62
error_hover = 0.14
disabled_control = 0.4
tab_drag_source = 0.28
sleeping_tab = 0.7
space_dot_idle = 0.7
background_noise_max = 0.16
modal_backdrop = 0.28
peek_backdrop = 0.16
menu_border = 0.12
hover = 0.07
surface_tint = 0.06
selected = 0.12
surface_hover = 0.09
accent_hover_blend = 0.12
soft_accent_border = 0.48
# How much of its surface colour frosted glass keeps over the blur.
frosted_glass = 0.55

# Theme picker popover motion; tune here without adding user facing settings.
[motion.theme_picker]
# The popover stays mounted for three quarters of this duration on close.
duration_ms = 240
scale_from = 0.6
# The popover shrinks to this scale as it fades on close.
scale_to = 0.2
# Blur in px the popover's contents sharpen from, and soften to on close.
blur_from = 8.0

# Higher stiffness is quicker; lower damping relative to stiffness adds bounce.
[motion.theme_picker.spring]
stiffness = 1100.0
damping = 48.0
mass = 1.0

[transparency.off]
window = 1.0
# Pages have their own surface color and retain enough opacity to read apart
# from the surrounding window material.
page = 0.36
surface_blur = 8.0
raised = 1.0

[transparency.subtle]
window = 0.72
page = 0.3
surface_blur = 16.0
raised = 1.0

[transparency.clear]
window = 0.46
page = 0.24
surface_blur = 24.0
raised = 1.0

[window]
gradient_angle_degrees = 135.0
gradient_turn = 0.09
light_tint_lightness = 0.87
swatch_saturation = 0.6
swatch_lightness = 0.55

[window.hues]
blue = 0.6
purple = 0.74
pink = 0.9
red = 0.99
orange = 0.07
yellow = 0.13
green = 0.38
teal = 0.49

[radii]
