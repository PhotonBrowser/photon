small_button = 10.0
keycap = 4.0
surface = 8.0
menu_item = 5.0
tooltip = 7.0
omnibox = 8.0
sidebar_omnibox_button = 7.0
page = 12.0
page_smoothing = 0.6
theme_accent_panel = 16.0
site_info_tile = 10.0
checkbox = 4.0
segment = 5.0
sidebar_collapsed_item = 8.0
sidebar_item = 12.0
sidebar_reveal = 12.0

[picker]
