[package]
name = "photon-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
ui-only = []

[dependencies]
photon-brand = { path = "../photon-brand" }
gpui = { package = "gpui-ce", path = "../../vendor/gpui-ce/crates/gpui", default-features = false }
gpui_platform = {
    package = "gpui_ce_platform",
    path = "../../vendor/gpui-ce/crates/gpui_platform",
    features = ["wayland", "x11"],
}
gpui_elements = { package = "gpui_ce_elements", path = "../../vendor/gpui-ce/crates/gpui_elements" }
photon-core = { path = "../photon-core" }
gpui-motion = { package = "gpui-ce-motion", path = "../gpui-motion", features = ["gpui"] }
photon-performance = { path = "../photon-performance" }
photon-storage = { path = "../photon-storage" }
photon-sound = { path = "../photon-sound" }
anyhow = "1"
futures = "0.3"
image = { version = "0.25", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8.23"
rodio = { version = "0.20", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
libc = "0.2"
gpui_apple = { package = "gpui_ce_apple", path = "../../vendor/gpui-ce/crates/gpui_apple" }
photon-presentation-ipc = { path = "../photon-presentation-ipc" }
core-video = "0.5.2"
foreign-types = "0.5"
io-surface = "0.16.1"
mach2 = "0.5"
metal = "0.33"
objc = "0.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "NSButton",
  "NSButtonCell",
  "NSCell",
  "NSControl",
  "NSGlassEffectView",
  "NSImage",
  "NSSegmentedControl",
  "NSResponder",
  "NSView",
  "objc2-quartz-core",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
  "CALayer",
  "CATransaction",
  "objc2-core-foundation",
  "objc2-core-graphics",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
  "CGColor",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "NSDictionary",
  "NSGeometry",
  "NSNull",
  "NSObject",
  "NSString",
] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[build-dependencies]
cc = "1"

[dev-dependencies]
gpui = { package = "gpui-ce", path = "../../vendor/gpui-ce/crates/gpui", default-features = false, features = ["test-support"] }
