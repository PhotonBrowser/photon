[package]
name = "photon-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
gpui = { package = "gpui-ce", path = "../../vendor/gpui-ce/crates/gpui", default-features = false }
gpui_platform = { package = "gpui_ce_platform", path = "../../vendor/gpui-ce/crates/gpui_platform" }
gpui_apple = { package = "gpui_ce_apple", path = "../../vendor/gpui-ce/crates/gpui_apple" }
gpui_elements = { package = "gpui_ce_elements", path = "../../vendor/gpui-ce/crates/gpui_elements" }
photon-core = { path = "../photon-core" }
photon-performance = { path = "../photon-performance" }
photon-shortcuts = { path = "../photon-shortcuts" }
photon-presentation-ipc = { path = "../photon-presentation-ipc" }
anyhow = "1"
image = { version = "0.25", default-features = false }
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
core-video = "0.5.2"
foreign-types = "0.5"
io-surface = "0.16.1"
mach2 = "0.5"
metal = "0.33"
objc = "0.2"

[build-dependencies]
cc = "1"
