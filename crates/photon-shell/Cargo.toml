[package]
name = "photon-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
ui-only = []

[dependencies]
photon-brand = { path = "../photon-brand" }
gpui = { package = "gpui-ce", path = "../../vendor/gpui-ce/crates/gpui", default-features = false }
gpui_platform = { package = "gpui_ce_platform", path = "../../vendor/gpui-ce/crates/gpui_platform" }
gpui_elements = { package = "gpui_ce_elements", path = "../../vendor/gpui-ce/crates/gpui_elements" }
photon-core = { path = "../photon-core" }
gpui-motion = { package = "gpui-ce-motion", path = "../gpui-motion", features = ["gpui"] }
photon-omnibox = { path = "../photon-omnibox" }
photon-performance = { path = "../photon-performance" }
photon-shortcuts = { path = "../photon-shortcuts" }
photon-storage = { path = "../photon-storage" }
photon-tab-sleep = { path = "../photon-tab-sleep" }
photon-haptics = { path = "../photon-haptics" }
anyhow = "1"
futures = "0.3"
image = { version = "0.25", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8.23"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
libc = "0.2"
gpui_apple = { package = "gpui_ce_apple", path = "../../vendor/gpui-ce/crates/gpui_apple" }
photon-presentation-ipc = { path = "../photon-presentation-ipc" }
core-video = "0.5.2"
foreign-types = "0.5"
io-surface = "0.16.1"
mach2 = "0.5"
metal = "0.33"
objc = "0.2"
raw-window-handle = "0.6"

[build-dependencies]
cc = "1"
