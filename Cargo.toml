[workspace]
resolver = "2"
members = [
    "crates/photon-cli",
    "crates/photon-core",
    "crates/photon-ffi",
    "crates/photon-app",
    "crates/photon-brand",
    "crates/photon-shell",
    "crates/photon-performance",
    "crates/photon-presentation-broker",
    "crates/photon-presentation-ipc",
    "crates/photon-storage",
    "crates/photon-sound",
]
exclude = [
    "Engine/Libraries/LibJS/Flap",
    "crates/gpui-motion",
    "vendor/gpui-ce",
]

[patch.crates-io]
# Keep the fork's optional GPUI adapter on the exact vendored native element types.
gpui-ce = { path = "vendor/gpui-ce/crates/gpui" }

[workspace.package]
edition = "2024"
license = "BSD-2-Clause"
version = "0.1.0"
