[workspace]
resolver = "2"
members = [
    "crates/photon-cli",
    "crates/photon-core",
    "crates/photon-ffi",
    "crates/photon-app",
    "crates/photon-brand",
    "crates/photon-shell",
    "crates/photon-performance",
    "crates/photon-presentation-broker",
    "crates/photon-presentation-ipc",
    "crates/photon-omnibox",
    "crates/photon-shortcuts",
    "crates/photon-storage",
]
exclude = ["Engine/Libraries/LibJS/Flap", "vendor/gpui-ce"]

[workspace.package]
edition = "2024"
license = "BSD-2-Clause"
version = "0.1.0"
