name: Bug report
description: Report a reproducible problem with Photon.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Photon. **Do not report security vulnerabilities here.** Use [private vulnerability reporting](https://github.com/PhotonBrowser/photon/security/advisories/new) instead.
        Photon is pre-release software; please search existing issues before filing.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the bug and its impact.
      placeholder: A clear, concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch Photon...
        2. Open...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Photon commit or build
      description: Run `git rev-parse --short HEAD` if building from source.
      placeholder: e.g. abc1234
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, and additional context
      description: Remove credentials, tokens, and personal data before sharing.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: This report does not contain sensitive vulnerability details.
          required: true
