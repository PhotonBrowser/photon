name: Photon upstream sync review

on:
  repository_dispatch:
    types:
      - photon_upstream_sync

permissions:
  contents: read
  issues: write

concurrency:
  group: photon-upstream-sync-issues
  cancel-in-progress: false

jobs:
  upstream-sync-review:
    name: Document completed Photon upstream sync
    runs-on: ubuntu-latest
    steps:
      - name: Check out Photon workflow source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Open or reuse upstream sync issue
        uses: actions/github-script@v7
        env:
          PHOTON_ROOT_SHA: ${{ github.event.client_payload.root_sha }}
          ENGINE_BEFORE_SHA: ${{ github.event.client_payload.engine_before_sha }}
          ENGINE_AFTER_SHA: ${{ github.event.client_payload.engine_after_sha }}
          GPUI_CE_BEFORE_SHA: ${{ github.event.client_payload.gpui_ce_before_sha }}
          GPUI_CE_AFTER_SHA: ${{ github.event.client_payload.gpui_ce_after_sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = require('./.github/scripts/upstream-sync-issue.cjs');
            await run({ github, context, core });
