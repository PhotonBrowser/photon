name: Photon upstream sync review

on:
  push:
    branches:
      - main
    paths:
      - Engine
      - vendor/gpui-ce
  workflow_dispatch:
    inputs:
      from_sha:
        description: "Previous Photon root commit SHA"
        required: true
        type: string
      to_sha:
        description: "New Photon root commit SHA"
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: photon-upstream-sync-issues
  cancel-in-progress: false

jobs:
  upstream-sync-review:
    name: Document tested dependency pin changes
    runs-on: ubuntu-latest
    steps:
      - name: Check out Photon history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Open or reuse upstream sync issue
        uses: actions/github-script@v7
        env:
          SYNC_FROM_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.from_sha || github.event.before }}
          SYNC_TO_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.to_sha || github.sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = require('./.github/scripts/upstream-sync-issue.cjs');
            await run({ github, context, core });
