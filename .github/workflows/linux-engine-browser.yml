name: Linux Engine browser smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-engine-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-engine-browser:
    name: Build Engine and render a local page (X11)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/ladybirdbrowser/ladybird-ci:2026.08.28
    timeout-minutes: 300
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      VCPKG_MAX_CONCURRENCY: 2

    steps:
      - name: Check out Photon and pinned submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Record the pinned Engine revision
        id: engine
        run: echo "revision=$(git -C Engine rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install virtual display and screenshot tools
        run: |
          apt-get update
          apt-get install --no-install-recommends -y \
            imagemagick \
            mesa-vulkan-drivers \
            python3-pil \
            x11-apps \
            xauth \
            xvfb

      - name: Set software-rendering and cache paths
        run: |
          echo "CCACHE_DIR=$RUNNER_TEMP/photon-ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=4G" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/photon-vcpkg-binary-cache" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/photon-ccache" "$RUNNER_TEMP/photon-vcpkg-binary-cache"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          echo "PHOTON_RENDER_SCREENSHOT=$RUNNER_TEMP/photon-linux-render-smoke.png" >> "$GITHUB_ENV"
          lvp_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          if [ -n "$lvp_icd" ]; then
            echo "VK_ICD_FILENAMES=$lvp_icd" >> "$GITHUB_ENV"
          fi

      - name: Restore C++ compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/photon-ccache
          key: photon-linux-ccache-${{ steps.engine.outputs.revision }}-${{ github.run_id }}
          restore-keys: |
            photon-linux-ccache-${{ steps.engine.outputs.revision }}-

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/photon-vcpkg-binary-cache
          key: photon-linux-vcpkg-${{ steps.engine.outputs.revision }}-${{ github.run_id }}
          restore-keys: |
            photon-linux-vcpkg-${{ steps.engine.outputs.revision }}-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-engine-browser

      - name: Build Photon Engine and app
        run: ./photon build --debug --verbose

      - name: Load and render a local web page through Photon
        run: >-
          xvfb-run -a
          -s "-screen 0 1280x800x24 +extension GLX +render -noreset"
          python3 scripts/linux_render_smoke.py

      - name: Upload the rendered page screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-page-render-smoke
          path: ${{ runner.temp }}/photon-linux-render-smoke.png
          if-no-files-found: ignore
