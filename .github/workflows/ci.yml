name: Photon CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: photon-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Photon lint and compile
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Photon and pinned submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check contributor acknowledgments
        if: github.event_name == 'pull_request'
        env:
          PULL_REQUEST_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! printf '%s\n' "$PULL_REQUEST_BODY" | grep -Eiq '^[[:space:]]*-[[:space:]]*\[x\] I read the AI-assisted work guidance'; then
            echo "Check the AI-assisted work acknowledgment in the PR template."
            exit 1
          fi
          if ! printf '%s\n' "$PULL_REQUEST_BODY" | grep -Eiq '^[[:space:]]*-[[:space:]]*\[x\] I resolved merge conflicts and will review and address applicable CodeRabbit'; then
            echo "Check the automated review and conflict acknowledgment in the PR template."
            exit 1
          fi

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            clang \
            cmake \
            ninja-build \
            python3 \
            pkg-config \
            desktop-file-utils \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-randr0-dev \
            libxcb-xinput-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libglib2.0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: checks

      - name: Check Photon
        run: ./photon check --verbose

      - name: Build Linux UI-only shell
        run: cargo build --release -p photon-app --bin Photon --features ui-only

      - name: Smoke test CLI
        run: |
          ./photon --help
          ./photon doctor
          ./photon deps status
          ./photon run --help
          ./photon desktop --help

      - name: Verify Linux desktop integration
        run: |
          temp_root="$(mktemp -d)"
          trap 'rm -rf "$temp_root"' EXIT
          CARGO_INSTALL_ROOT="$temp_root/cargo" \
          XDG_DATA_HOME="$temp_root/share" \
            ./photon install
          desktop_file="$temp_root/share/applications/org.photonbrowser.photon.desktop"
          icon_file="$temp_root/share/icons/hicolor/1024x1024/apps/org.photonbrowser.photon.png"
          test ! -e "$desktop_file"
          CARGO_INSTALL_ROOT="$temp_root/cargo" \
          XDG_DATA_HOME="$temp_root/share" \
            ./photon desktop install
          desktop-file-validate "$desktop_file"
          test -x "$temp_root/cargo/bin/photon"
          test -s "$icon_file"
          grep -F "x-scheme-handler/http=org.photonbrowser.photon.desktop;" "$temp_root/share/applications/mimeinfo.cache"
          grep -F "x-scheme-handler/https=org.photonbrowser.photon.desktop;" "$temp_root/share/applications/mimeinfo.cache"
          CARGO_INSTALL_ROOT="$temp_root/cargo" \
          XDG_DATA_HOME="$temp_root/share" \
            ./photon desktop uninstall
          test ! -e "$desktop_file"
          test ! -e "$icon_file"
          test -x "$temp_root/cargo/bin/photon"

  tests:
    name: Photon tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Photon and pinned submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check contributor acknowledgments
        if: github.event_name == 'pull_request'
        env:
          PULL_REQUEST_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! printf '%s\n' "$PULL_REQUEST_BODY" | grep -Eiq '^[[:space:]]*-[[:space:]]*\[x\] I read the AI-assisted work guidance'; then
            echo "Check the AI-assisted work acknowledgment in the PR template."
            exit 1
          fi
          if ! printf '%s\n' "$PULL_REQUEST_BODY" | grep -Eiq '^[[:space:]]*-[[:space:]]*\[x\] I resolved merge conflicts and will review and address applicable CodeRabbit'; then
            echo "Check the automated review and conflict acknowledgment in the PR template."
            exit 1
          fi

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            clang \
            cmake \
            ninja-build \
            python3 \
            pkg-config \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-randr0-dev \
            libxcb-xinput-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libglib2.0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: checks

      - name: Test Photon
        run: ./photon test

  checks:
    name: Photon checks
    if: always()
    needs:
      - lint
      - tests
    runs-on: ubuntu-24.04
    steps:
      - name: Require all validation jobs to pass
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.tests.result }}
        run: |
          if [[ "$LINT_RESULT" == "success" && "$TEST_RESULT" == "success" ]]; then
            echo "All Photon validation jobs passed."
          else
            echo "Photon lint and compile job: $LINT_RESULT"
            echo "Photon test job: $TEST_RESULT"
            exit 1
          fi
