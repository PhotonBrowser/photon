name: Photon CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: photon-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Photon checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Photon and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check contributor acknowledgments
        if: github.event_name == 'pull_request'
        env:
          PULL_REQUEST_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! printf '%s\n' "$PULL_REQUEST_BODY" | grep -Eiq '^[[:space:]]*-[[:space:]]*\[x\] I read the AI-assisted work guidance'; then
            echo "Check the AI-assisted work acknowledgment in the PR template."
            exit 1
          fi
          if ! printf '%s\n' "$PULL_REQUEST_BODY" | grep -Eiq '^[[:space:]]*-[[:space:]]*\[x\] I resolved merge conflicts and will review and address applicable CodeRabbit'; then
            echo "Check the automated review and conflict acknowledgment in the PR template."
            exit 1
          fi

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            clang \
            cmake \
            ninja-build \
            python3 \
            pkg-config \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-randr0-dev \
            libxcb-xinput-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libglib2.0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check Photon
        run: ./photon check --verbose

      - name: Smoke test CLI
        run: |
          ./photon --help
          ./photon doctor
          ./photon deps status

      - name: Test Photon
        run: ./photon test
